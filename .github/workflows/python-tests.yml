name: Python tests

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.10", "3.12"]
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: ${{ matrix.python-version }}
      - name: Test retail discount calculator
        working-directory: courses/is-2053/projects/retail-discount-calculator
        run: python -m unittest discover -p "test_*.py" -v
      - name: Test golf score tracker
        working-directory: courses/is-2053/projects/golf-score-tracker
        run: python -m unittest discover -p "test_*.py" -v
